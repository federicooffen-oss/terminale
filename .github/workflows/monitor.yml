name: Monitoraggio portafogli
on:
  schedule:
    - cron: '0 17 * * 1-5'
  workflow_dispatch:
    inputs:
      storico:
        description: 'Ricalcola anche lo storico dei portafogli (backtest)'
        type: boolean
        default: false
      lungo:
        description: 'Calcola lo storico lungo (15 anni) per classe di attivi'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy xlrd
      - name: Anagrafica titoli di Stato (file del Tesoro)
        continue-on-error: true
        run: python anagrafica_titoli.py
      - name: Calcolo VaR e deriva dei pesi
        env:
          STORICO: ${{ inputs.storico }}
        run: python monitor.py
      - name: Storico lungo per classe di attivi
        if: ${{ inputs.lungo }}
        continue-on-error: true
        run: python storico_lungo.py
      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add monitor.json catalogo.json isin_cache.json titoli_stato.json storico_portafogli.json storico_lungo.json || true
          git diff --cached --quiet || git commit -m "Monitoraggio portafogli"
          git pull --rebase || true
          git push || true
      - name: Avviso per email (segnalazione GitHub)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f avvisi.md ]; then
            gh issue create --title "Avvisi portafogli $(date +%F)" --body-file avvisi.md
          fi
