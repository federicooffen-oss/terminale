name: Monitoraggio portafogli
on:
  schedule:
    - cron: '0 17 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy
      - name: Calcolo VaR e deriva dei pesi
        run: python monitor/monitor.py
      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add consulenza/monitor.json monitor/isin_cache.json || true
          git diff --cached --quiet || git commit -m "Monitoraggio portafogli"
          git pull --rebase || true
          git push || true
      - name: Avviso per email (segnalazione GitHub)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f monitor/avvisi.md ]; then
            gh issue create --title "Avvisi portafogli $(date +%F)" --body-file monitor/avvisi.md
          fi
