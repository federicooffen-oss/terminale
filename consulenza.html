let REAL=null; // volatilità e correlazioni reali (5 anni), lette da monitor.json
function setReal(m){REAL=null;if(!m||!m.isin||!m.sd||!m.corr)return;const ix={};m.isin.forEach((x,i)=>ix[x]=i);REAL={ix,sd:m.sd,corr:m.corr,giorni:m.giorni}}
function varAnnuo(w){ // VaR parametrico 99% annuo (%): dati reali se disponibili, altrimenti ipotesi per classe
  const ks=Object.keys(w);let v=0;

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function classifica(nome){
  const t=nome.toLowerCase();

  let cls='Azionario';
  if(/gold|physical|silver|commodit|bitcoin|crypto|\boro\b/.test(t))cls='Oro';
  else if(/overnight|\bcash\b|money market|ultrashort|t-bill|estr|rate swap|liquidity/.test(t))cls='Monetario';
  else if(/bond|govt|government|treasury|gilt|aggregate|corporate|inflation|credit|high yield|ibonds|btp|oat|bund|floating|obblig/.test(t))cls='Obbligazionario';

const TIERS=[{k:'pac',n:'PAC',max:3,min:0},{k:'ess',n:'Essenziale',max:3},{k:'std',n:'Standard',max:6},{k:'full',n:'Completo',max:99}];
const tierOf=c=>c<3000?TIERS[0]:c<10000?TIERS[1]:c<50000?TIERS[2]:TIERS[3];
function applyVariant(w,variant){if(variant!=='fineco')return{...w};const o={};Object.entries(w).forEach(([k,p])=>{const t=FIN_SUB[k]||k;o[t]=(o[t]||0)+p});return o}
function mergeLines(w,tier,capital){ // accorpa le righe piccole nel comparto più simile
  const L=Object.entries(w).map(([k,p])=>({k,p}));const minPct=Math.max(5,1000/capital*100);
  const cls=k=>BY[k].cls==='Oro'?'Azionario':BY[k].cls;
  const merged=[];
  while(true){
    L.sort((a,b)=>b.p-a.p);
    const small=L[L.length-1];
    if(L.length<=tier.max&&small.p>=minPct-1e-9)break;
    if(L.length===1)break;
    const rest=L.slice(0,-1),tgt=rest.find(x=>cls(x.k)===cls(small.k))||rest[0];
    tgt.p+=small.p;merged.push([small.k,tgt.k]);L.pop();
  }
  const o={};L.forEach(x=>o[x.k]=x.p);return{w:o,merged};
}
function buildPlan(pf,capital,opt){
  const tier=tierOf(capital);let w=applyVariant(pf.w,opt.variant);let merged=[];const monthly=tier.k==='pac';if(monthly)capital=opt.monthly||250;
  if(tier.k!=='full'){const m=mergeLines(w,tier,monthly?1e9:capital);w=m.w;merged=m.merged}
  const lines=[];let bucket=null;let total=capital;
  const yr=new Date().getFullYear();
  if(tier.k==='full'&&opt.bonds==='scad'&&opt.bAmt>0&&opt.bYrs>0){
    bucket=Math.min(opt.bAmt,capital*.9);total=capital-bucket;
    const name=opt.bYrs<=1?'BOT':'BTP';lines.push({k:'BTPB',isin:'da scegliere alla data',name:`${name} con scadenza ${yr+Math.round(opt.bYrs)} (titolo singolo)`,cls:'Obbligazionario',pct:bucket/capital*100,amt:bucket,price:1000,qty:Math.floor(bucket/1000),unit:'taglio 1.000 €',fin:false,sing:true});
  }
  let ws=Object.entries(w);
  if(tier.k==='full'&&opt.bonds==='mista'){ // 30% della quota governativa 3-5 anni / generale in BTP singoli
    const key=w.GOVB?'GOVB':w.GOVM?'GOVM':null;
    if(key){const p=w[key]*.5;ws=ws.map(([k,v])=>k===key?[k,v-p]:[k,v]);ws.push(['BTPM',p])}
  }
  ws.forEach(([k,p])=>{
    const amt=total*p/100;
    if(k==='BTPM'){const q=Math.floor(amt/1000);lines.push({k,isin:'da scegliere alla data',name:'BTP e titoli di Stato europei singoli (scadenze 3-7 anni)',cls:'Obbligazionario',pct:p*total/capital,amt:q*1000,price:1000,qty:q,unit:'taglio 1.000 €',fin:false,sing:true});return}
    const i=BY[k],q=monthly?null:Math.floor(amt/i.price);
    lines.push({k,isin:i.isin,name:i.name,cls:i.cls,pct:p*total/capital,amt:monthly?amt:q*i.price,price:i.price,qty:q,unit:'',fin:i.fin,ter:i.ter,sing:false});
  });
  lines.sort((a,b)=>b.pct-a.pct);
  const spent=lines.reduce((a,l)=>a+l.amt,0);
  return{tier,lines,cash:capital-spent,merged,bucket,spent,monthly,capital};
}

const STEPS=['auth','quest','quiz','aml','profilo','contratto'];
const PF=()=>st.PF;
const opt=(q,cur,act,extra='')=>q.o.map((o,i)=>`<label class="opt"><input type="radio" name="${q.id||'x'}${extra}" data-act="${act}" data-q="${q.id||''}" data-v="${i}" ${cur===i?'checked':''}><span>${esc(o)}</span></label>`).join('');
const block=(q,cur,act='ans')=>`<div class="q"><div class="t">${esc(q.t)}</div>${opt(q,cur,act)}</div>`;
function head(){return`<div class="in"><div class="brand"><img alt="" src="${SYM}"><div><b>Binario F</b><span>Consulenza Finanziaria Indipendente</span></div></div>
<div class="row"><div class="seg" role="group" aria-label="Vista"><button data-act="role" data-v="cliente" aria-pressed="${st.role==='cliente'}">Vista cliente</button><button data-act="role" data-v="consulente" aria-pressed="${st.role==='consulente'}">Vista consulente</button></div><button class="btn sm" data-act="reset">Ricomincia</button></div></div>`}
const PROTO=`<div class="proto"><b>Prototipo di test.</b> Prezzi, rendimenti e statistiche sono simulati; punteggi, soglie e VaR usano ipotesi da validare. Non inserire dati personali reali: nulla viene inviato.</div>`;
const FOOT=`<div class="foot">Dott. Federico Offen, consulente finanziario indipendente iscritto all'Albo Unico OCF (delibera n. 2916) · Binario F, Via Luigi Cibrario 65, Torino · www.binariof.it. Servizio di consulenza in materia di investimenti: le decisioni di investimento restano del cliente. I rendimenti passati, e quelli simulati, non sono indicativi di quelli futuri.</div>`;
const app=$('#app');
function render(){
  const bd=$('#band');bd.innerHTML=head();bd.dataset.r=st.role;app.className='wrap'+(st.role==='consulente'?' wide':'');
  app.innerHTML=PROTO+(st.role==='consulente'?adminView():clientView())+FOOT;save();
}
const stepper=n=>`<div class="steps">${STEPS.slice(1).map((_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`;
/* ======================= CLIENTE ======================= */
function clientView(){
  const s=st.step;
  if(s==='auth')return `<div class="card"><h1>Il tuo portafoglio, da un consulente indipendente</h1><p class="muted">Rispondi al questionario di adeguatezza, scopri il tuo profilo di rischio e scegli un portafoglio modello seguito da un consulente iscritto all'Albo. Eseguirai tu le operazioni dal tuo conto titoli: non gestiamo il tuo patrimonio.</p>
  <label class="f">Nome e cognome<input type="text" id="nome" value="${esc(st.user.nome)}" placeholder="Nome di prova"></label><label class="f">Email<input type="email" id="email" value="${esc(st.user.email)}" placeholder="prova@esempio.it"></label>
  <div class="row"><button class="btn pri" data-act="go" data-v="quest">Inizia il questionario</button></div></div>`;
  if(s==='quest'){const A=st.A,ok=QA_DONE(A);
    return `<div class="card">${stepper(1)}<h2>Questionario di adeguatezza</h2><p class="muted small">Le risposte determinano il tuo profilo di rischio. Rispondi con sincerità: non esistono risposte giuste.</p>
    <h3>La tua situazione finanziaria</h3>${QB.map(q=>block(q,A[q.id])).join('')}
    <h3>Obiettivi e tolleranza al rischio</h3>${QT.map(q=>block(q,A[q.id])).join('')}${block({...D1,id:'d1'},A.d1)}
    <h3>Orizzonte temporale</h3>${block({...HOR,id:'hor'},A.hor)}
    <h3>Sostenibilità</h3>${block({id:'esg',t:'Vuoi che gli strumenti promuovano obiettivi di sostenibilità ambientale o sociale, o considerino i loro impatti negativi?',o:['No, non è un criterio per me','Sì']},A.esg)}
    ${A.esg===1?block({id:'esgp',t:'Quota minima in investimenti sostenibili',o:['Nessuna','Almeno il 5%','Almeno il 15%','Almeno il 30%','Non so']},A.esgp):''}
    <div class="row"><button class="btn pri" data-act="go" data-v="quiz" ${ok?'':'disabled'}>Continua</button>${ok?'':'<span class="muted small">Rispondi a tutte le domande per continuare.</span>'}</div></div>`}
  if(s==='quiz'){const r=quizResult(st.A);
    return `<div class="card">${stepper(2)}<h2>Verifica di conoscenza</h2><p class="muted small">Quattro domande sugli strumenti dei nostri portafogli. Serve a verificare che tu li conosca abbastanza per investire con consapevolezza.</p>
    ${QUIZ.map(q=>block(q,st.A[q.id],'quiz')).join('')}
    ${r.done?(r.pass?`<div class="alert"><b class="ok">Verifica superata.</b></div>`:`<div class="alert"><b class="ko">Verifica non superata.</b><p>Con più di un errore, o con un errore sull'ETF, non possiamo raccomandarti un portafoglio. Leggi le spiegazioni e riprova.</p><ul class="why">${r.wrong.map(q=>`<li><b>${esc(q.t)}</b> ${esc(q.why)}</li>`).join('')}</ul><div class="row"><button class="btn" data-act="quizreset">Rifai il test</button></div></div>`):''}
    <div class="row"><button class="btn" data-act="go" data-v="quest">Indietro</button><button class="btn pri" data-act="go" data-v="aml" ${r.pass?'':'disabled'}>Continua</button></div></div>`}
  if(s==='aml')return `<div class="card">${stepper(3)}<h2>Scheda antiriciclaggio</h2><p class="muted small">Informazioni richieste dal D.Lgs. 231/2007 per l'adeguata verifica. I documenti d'identità andranno inviati via email al passo successivo.</p>
    ${AML.map(q=>block(q,st.aml[q.id],'aml')).join('')}
    <div class="row"><button class="btn" data-act="go" data-v="quiz">Indietro</button><button class="btn pri" data-act="calc" ${AML.every(q=>st.aml[q.id]!=null)?'':'disabled'}>Scopri il tuo profilo</button></div></div>`;
  if(s==='profilo')return profiloView();
  if(s==='contratto')return contrattoView();
  return statoView();
}
function lineOpt(id){const p=PF()[id],s=stats(p.w),b=pfBand(p.w);return{p,s,b}}
function profiloView(){
  const pr=st.profile,el=eligible(pr,st.A,PF());
  const head=`<div class="card">${stepper(4)}<h2>Il tuo profilo di rischio</h2><div class="row"><div class="big">${BANDS[pr.band]}</div><div class="muted small">VaR annuo (99%) del portafoglio adatto: ${BAND_VAR[pr.band]}</div></div>
  <div class="gauge" style="grid-template-columns:repeat(4,1fr)">${BANDS.map((b,i)=>`<i class="${i<=pr.band?'on':''}" title="${b}"></i>`).join('')}</div>
  <ul class="why">${pr.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`;
  if(!el.length)return head+`<div class="card"><div class="alert"><b>Nessun portafoglio raccomandabile</b><p>${esc(whyNone(pr,st.A,PF()))}</p></div><div class="row"><button class="btn" data-act="go" data-v="quest">Rivedi le risposte</button></div></div>`;
  const tier=tierOf(st.capital),sorted=el.slice().sort((a,b)=>stats(PF()[a].w).va-stats(PF()[b].w).va);
  const ch=sorted.map(id=>{const{p,s,b}=lineOpt(id);return `<div class="ch" role="button" tabindex="0" data-act="pick" data-v="${id}" aria-pressed="${st.chosen===id}"><header><h3>${esc(p.nome)}</h3><span class="muted small">${b===pr.band?'Fascia del tuo profilo':'Più prudente'} · ${BANDS[b]}</span></header>
   <p class="small muted">${esc(p.obiettivo)} · orizzonte consigliato da ${MINY[id]} ${MINY[id]===1?'anno':'anni'}</p>
   <div class="stats"><div><small>Rendimento annuo storico simulato</small><b>${pc0(s.cagr)}</b></div><div><small>Volatilità</small><b>${pc0(s.vol)}</b></div><div><small>Perdita massima storica</small><b>${pc0(s.mdd)}</b></div><div><small>VaR annuo 99%</small><b>${n1(s.va)}%</b></div><div><small>Azioni</small><b>${Object.entries(p.w).reduce((a,[k,v])=>a+(BY[k].cls==='Azionario'?v:0),0)}%</b></div></div></div>`}).join('');

function growth(vals,h=200){const W=640,P=34,mx=Math.max(...vals),mn=Math.min(...vals),X=i=>P+i*(W-P-8)/(vals.length-1),Y=v=>h-22-(v-mn)/(mx-mn||1)*(h-36);

  return `<div class="card inner"><h3>Aggiungi uno strumento</h3><div class="grid2"><label class="f">Cerca per ISIN, nome o codice di borsa<input type="search" id="cerca" autocomplete="off" placeholder="es. IE00B4L5Y983, gold, momentum" value="${esc(st.q||'')}"></label>
  <label class="f">Tipo<select id="qc">${[['','Tutti'],['Azionario','Azionario'],['Obbligazionario','Obbligazionario'],['Monetario','Monetario'],['Oro','Materie prime / oro']].map(([v,l])=>`<option value="${v}" ${(st.qc||'')===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
  <div id="risultati">${risultatiHtml()}</div>
  <p class="small muted">${CAT?`Catalogo: ${CAT.strumenti.length} strumenti con prezzo (Borsa Italiana o Xetra), aggiornato ${esc(CAT.aggiornato)}.${CAT.senza_prezzo&&CAT.senza_prezzo.length?` ${CAT.senza_prezzo.length} non hanno un prezzo leggibile e non si possono usare.`:''}`:'Catalogo completo non ancora caricato: per ora si possono cercare solo gli strumenti già nel sistema.'}</p></div>`;
}
function elencoRicerca(){
  const base=CAT?CAT.strumenti.map(c=>({isin:c.isin,nome:c.nome,ticker:c.ticker,prezzo:c.prezzo,sd:c.sd,ok:true})).concat((CAT.senza_prezzo||[]).map(c=>({isin:c.isin,nome:c.nome,ok:false})))
    :INS.filter(i=>!i.finOnly).map(i=>({isin:i.isin,nome:i.name,prezzo:i.price,ok:true}));
  return base;
}
function risultatiHtml(){
  const q=(st.q||'').toLowerCase().split(/\s+/).filter(Boolean),qc=st.qc||'';if(!q.length&&!qc)return '<p class="small muted">Scrivi almeno una parte del nome o dell\'ISIN per vedere gli strumenti.</p>';
  const w=st.edit||PF()[st.aid].w,inW=new Set(Object.keys(w).filter(k=>BY[k]).map(k=>BY[k].isin));
  const r=elencoRicerca().filter(c=>!inW.has(c.isin)&&q.every(t=>(c.isin+' '+c.nome+' '+(c.ticker||'')).toLowerCase().includes(t))&&(!qc||classifica(c.nome).cls===qc));
  if(!r.length)return '<p class="small muted">Nessuno strumento trovato (o già presente nel portafoglio).</p>';
  return `<ul class="srch">${r.slice(0,12).map(c=>{const k=classifica(c.nome);return `<li><div><b>${esc(c.nome)}</b><div class="small muted">${c.isin}${c.ticker?' · '+esc(c.ticker):''} · ${CLS_LABEL[k.cls]}${k.esg?' · ESG':''}${c.prezzo?' · '+eur(c.prezzo,2):''}${c.sd?' · vol. '+n1(c.sd*16*100)+'%':''}</div></div>${c.ok?`<button class="btn sm" data-act="add" data-v="${c.isin}">Aggiungi</button>`:'<span class="small ko">senza prezzo</span>'}</li>`}).join('')}</ul>${r.length>12?`<p class="small muted">Primi 12 di ${r.length}: restringi la ricerca.</p>`:''}`;
}
function esportaModelli(){
  const pesi={},out={nota:"Pesi dei portafogli modello per ISIN. 'ultimo_ribilanciamento' è la data dell'ultima volta che i clienti hanno riportato il portafoglio ai pesi del modello: aggiornala quando pubblichi una variazione. 'fascia' è la fascia dichiarata (0 Basso, 1 Medio-basso, 2 Medio-alto, 3 Alto).",portafogli:{},soglie:{deriva_punti:5,preavviso_var:0.9},nomi:{}};
  Object.entries(PF()).forEach(([id,p])=>{const o={};Object.entries(p.w).forEach(([k,x])=>{if(BY[k]){o[BY[k].isin]=x;out.nomi[BY[k].isin]=BY[k].name}});
    out.portafogli[id]={nome:p.nome,fascia:fasciaDich(id),ultimo_ribilanciamento:(st.rib&&st.rib[id])||'2026-10-31',pesi:o}});
  return JSON.stringify(out,null,1);
}
const GHK='bf-ghtok';
const ghTok=()=>{try{return localStorage.getItem(GHK)||''}catch(e){return''}};
function ghRepo(){const h=location.hostname,m=h.match(/^([^.]+)\.github\.io$/);if(m)return{o:m[1],r:location.pathname.split('/').filter(Boolean)[0]||''};try{const x=(localStorage.getItem('bf-ghrepo')||'').split('/');return{o:x[0]||'',r:x[1]||''}}catch(e){return{o:'',r:''}}}
async function ghSalva(avvia){
  const tok=ghTok(),{o,r}=ghRepo();if(!tok){st.ghmsg={e:1,t:'Incolla prima la chiave di accesso GitHub.'};return}
  if(!o||!r){st.ghmsg={e:1,t:'Questa funzione va usata dalla pagina pubblicata su GitHub Pages.'};return}
  const H={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},U=`https://api.github.com/repos/${o}/${r}/contents/modelli.json`;
  try{
    const g=await fetch(U,{headers:H,cache:'no-store'});if(!g.ok)throw new Error(g.status===401?'Chiave non valida o scaduta.':g.status===404?'Repository o file non trovato (controlla i permessi della chiave).':'Lettura non riuscita ('+g.status+').');
    const sha=(await g.json()).sha,txt=esportaModelli(),b64=btoa(String.fromCharCode(...new TextEncoder().encode(txt)));
    const p=await fetch(U,{method:'PUT',headers:H,body:JSON.stringify({message:"Aggiornamento portafogli dall'app",content:b64,sha})});
    if(!p.ok)throw new Error(p.status===403||p.status===404?'La chiave non ha il permesso di scrivere (serve "Contents: Read and write").':'Salvataggio non riuscito ('+p.status+').');
    let t='Portafogli salvati sul repository.';
    if(avvia){const d=await fetch(`https://api.github.com/repos/${o}/${r}/actions/workflows/monitor.yml/dispatches`,{method:'POST',headers:H,body:JSON.stringify({ref:'main'})});t+=d.ok?' Controllo avviato: tra qualche minuto il monitoraggio userà i nuovi portafogli.':' Il controllo non si è avviato da solo (serve il permesso "Actions: Read and write"): lo trovi in Actions → Run workflow.'}
    st.ghmsg={e:0,t};st.dirty=false;st.log.push('modelli.json salvato sul repository')
  }catch(e){st.ghmsg={e:1,t:String(e.message||e)}}
}
function esportaCard(){const m=st.ghmsg;return `<div class="card"><h2>Salva sul repository</h2><p class="small muted">Dopo aver pubblicato variazioni, questo pulsante scrive i portafogli nel file <code>modelli.json</code> del repository e fa partire il controllo, così il monitoraggio quotidiano usa subito i portafogli aggiornati.</p>
  <label class="f">Chiave di accesso GitHub (resta solo su questo computer)<input type="password" id="ghtok" autocomplete="off" placeholder="github_pat_…" value="${esc(ghTok())}"></label>
  <div class="row"><button class="btn pri" data-act="ghsave" data-v="1">Salva e avvia il controllo</button><button class="btn" data-act="ghsave" data-v="0">Solo salva</button></div>
  ${m?`<p class="small ${m.e?'ko':'ok'}">${esc(m.t)}</p>`:''}
  <details><summary class="small">Mostra il testo di modelli.json (per copiarlo a mano)</summary><textarea id="export" rows="6" readonly>${esc(esportaModelli())}</textarea></details></div>`}
function syncModelli(j){ // il repository è la fonte dei portafogli, salvo variazioni pubblicate qui e non ancora salvate
  if(!j||!j.portafogli||st.dirty)return;const nomi=j.nomi||{};
  Object.entries(j.portafogli).forEach(([id,p])=>{if(!PF()[id])return;const w={};
    Object.entries(p.pesi||{}).forEach(([isin,x])=>{let ex=INS.find(i=>i.isin===isin);
      if(!ex){const k=addIns({isin,nome:nomi[isin]||isin});ex=BY[k];if(!(st.xins||[]).some(r=>r.isin===isin))st.xins=(st.xins||[]).concat([{isin,nome:nomi[isin]||isin,k}])}
      w[ex.k]=x});
    if(Object.keys(w).length)PF()[id].w=w;if(p.ultimo_ribilanciamento){st.rib=Object.assign({},st.rib,{[id]:p.ultimo_ribilanciamento})}});
  st.edit=null;
}
let CAT=null,CATTRY=false;
function loadCat(){if(CAT||CATTRY)return;CATTRY=true;try{fetch('catalogo.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(!j||!j.strumenti)return;CAT=j;
  setReal({isin:j.strumenti.map(s=>s.isin),sd:j.strumenti.map(s=>s.sd),corr:j.corr.map(r=>r.map(x=>x/100)),giorni:j.giorni});
  j.strumenti.forEach(s=>{const ex=INS.find(i=>i.isin===s.isin);if(ex&&s.prezzo)ex.price=s.prezzo});render()}).catch(()=>{})}catch(e){}}
/* ======================= EVENTI ======================= */
function diffOps(o,n){const ops=[];const ks=new Set([...Object.keys(o),...Object.keys(n)]);
  ks.forEach(k=>{const d=(n[k]||0)-(o[k]||0);if(d)ops.push(`<b>${d>0?'Acquista':'Vendi'}</b> ${BY[k].name}: ${(o[k]||0)}% → ${(n[k]||0)}% (${eur(Math.abs(d)/100*st.capital)} su ${eur(st.capital)})`)});return ops}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.tagName==='INPUT'&&t.type!=='radio')return;const a=t.dataset.act,v=t.dataset.v,q=t.dataset.q;
  if(a==='role'){st.role=v;if(v==='consulente')loadCat()}
  else if(a==='add'){const c=elencoRicerca().find(x=>x.isin===v);if(c){const k=addIns(c);if(BY[k].ext&&!(st.xins||[]).some(x=>x.isin===v)){st.xins=(st.xins||[]).concat([{isin:v,nome:c.nome,prezzo:c.prezzo,sd:c.sd,k}])}
      st.okpub=false;st.edit=st.edit||JSON.parse(JSON.stringify(PF()[st.aid].w));st.edit[k]=st.edit[k]||5;st.q=''}}
  else if(a==='ghsave'){st.ghmsg={e:0,t:'Salvataggio in corso…'};render();ghSalva(v==='1').then(()=>{save();render()});return}
  else if(a==='rm'){st.okpub=false;st.edit=st.edit||JSON.parse(JSON.stringify(PF()[st.aid].w));delete st.edit[v]}
  else if(a==='reset'){st=fresh()}
  else if(a==='go'){if(st.step==='auth'){st.user.nome=($('#nome')||{}).value||st.user.nome;st.user.email=($('#email')||{}).value||st.user.email}st.step=v}
  else if(a==='ans')st.A[q]=+v;
  else if(a==='quiz')st.A[q]=+v;
  else if(a==='aml')st.aml[q]=+v;
  else if(a==='quizreset'){QUIZ.forEach(z=>delete st.A[z.id])}
  else if(a==='calc'){st.profile=scoreProfile(st.A);st.chosen=null;st.step='profilo'}
  else if(a==='pick')st.chosen=v;
  else if(a==='variant')st.variant=v;
  else if(a==='bonds')st.bonds=v;
  else if(a==='contract')st.contract=v;
  else if(a==='sent'){st.status='attesa';st.step='stato';if(!st.held)st.held={id:st.chosen,w:null}}
  else if(a==='tab')st.tab=v;
  else if(a==='done'){const n=st.notifs.find(x=>x.id===+v);if(n){n.done=true;st.held={id:n.p,w:JSON.parse(JSON.stringify(PF()[n.p].w))}}}
  else if(a==='status'){st.status=v;if(st.step!=='stato')st.step='stato';st.log.push(`Stato cliente: ${STL[v]}`)}
  else if(a==='aid'){st.aid=v;st.edit=null;st.okpub=false}
  else if(a==='discard'){st.edit=null;st.okpub=false}
  else if(a==='publish'){const m=($('#motivo')||{}).value||st.motivo||'';st.motivo=m;if(!m.trim()){alert_('Scrivi la motivazione.');return}
    const p=PF()[st.aid],nw=st.edit,ops=diffOps(p.w,nw);if(!ops.length){alert_('Nessuna differenza.');return}
    const b0=fasciaDich(st.aid),b1=bandOf(varAnnuo(nw));
    if(b1>b0){alert_(`Modifica bloccata: il VaR (${n1(varAnnuo(nw))}%) sfora la fascia ${BANDS[b0]}.`);return}
    st.okpub=false;st.motivo='';st.notifs.push({id:Date.now(),p:st.aid,date:new Date().toLocaleDateString('it-IT'),titolo:`Variazione ${p.nome}`,motivo:m.trim(),ops,done:false});
    st.log.push(`${st.aid}: variazione pubblicata (${ops.length} operazioni)${b0!==b1?`, fascia da ${BANDS[b0]} a ${BANDS[b1]}`:''}`);p.w=JSON.parse(JSON.stringify(nw));st.rib=Object.assign({},st.rib,{[st.aid]:new Date().toISOString().slice(0,10)});st.dirty=true;st.edit=null}
  else return;
  render();
});
function alert_(m){const x=$('#app .err');if(x)x.remove();const d=document.createElement('div');d.className='err';d.textContent=m;app.prepend(d)}
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act||t.id,v=t.dataset.v;
  if(t.type==='radio')return;
  if(a==='capital'){st.capital=Math.max(0,+t.value||0)}
  else if(a==='monthly'){st.monthly=Math.max(0,+t.value||0)}
  else if(a==='bAmt'){st.bAmt=Math.max(0,+t.value||0)}
  else if(a==='bYrs'){st.bYrs=Math.min(10,Math.max(1,+t.value||1))}
  else if(a==='fee'){st.fees[v]=+t.value||0}
  else if(a==='bank'){st.bank[v]=t.value}
  else if(a==='w'){st.okpub=false;st.edit=st.edit||JSON.parse(JSON.stringify(PF()[st.aid].w));const x=Math.max(0,Math.min(100,+t.value||0));if(x)st.edit[v]=x;else delete st.edit[v]}
  else if(t.id==='ghtok'){try{localStorage.setItem(GHK,t.value.trim())}catch(e){}return}
  else if(t.id==='qc'){st.qc=t.value;const r=$('#risultati');if(r)r.innerHTML=risultatiHtml();return}
  else if(t.id==='motivo'){st.motivo=t.value;save();return}
  else if(t.id==='nome'||t.id==='email'){st.user[t.id==='nome'?'nome':'email']=t.value;save();return}
  else return;
  render();
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='cerca'){st.q=t.value;const r=$('#risultati');if(r)r.innerHTML=risultatiHtml()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.ch[data-act]')){e.preventDefault();e.target.click()}});
try{fetch('modelli.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.portafogli){syncModelli(j);save();render()}}).catch(()=>{})}catch(e){}
let MONI=null;try{fetch('monitor.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{MONI=j;setReal(j&&j.mercato);if(j&&j.mercato&&j.mercato.prezzi)j.mercato.isin.forEach((x,n)=>{const ex=INS.find(i=>i.isin===x);if(ex&&j.mercato.prezzi[n])ex.price=j.mercato.prezzi[n]});if(st.role==='consulente')loadCat();render()}).catch(()=>{})}catch(e){}
render();
</script>
