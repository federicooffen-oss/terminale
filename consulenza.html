function classifica(nome){

  if(/gold|physical|silver|commodit|bitcoin|crypto|\boro\b/.test(t))cls='Oro';
  else if(/overnight|\bcash\b|money market|ultrashort|t-bill|estr|rate swap|liquidity/.test(t))cls='Monetario';
  else if(/bond|govt|government|treasury|gilt|aggregate|corporate|inflation|credit|high yield|ibonds|btp|oat|bund|floating|obblig/.test(t))cls='Obbligazionario';

  if(t.tipo==='CCT')return Math.min(T,.25);             // tasso variabile: si riprezza ogni 6 mesi
  if(t.tipo==='BOT'||t.tipo==='CTZ'||t.tasso===0)return T/(1+y);   // zero coupon
  const c=(t.tasso==null?TS_Y0:t.tasso)/100,n=Math.max(1,Math.ceil(T*2-1e-9));let pv=0,pt=0;
  for(let i=0;i<n;i++){const tt=T-i*.5;if(tt<=0)continue;const cf=c/2+(i===0?1:0),d=cf/Math.pow(1+y/2,2*tt);pv+=d;pt+=tt*d}

const beV=id=>((document.getElementById(id)||{}).value||'').trim();
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act^="be-"]');if(!t||!BE.on)return;e.preventDefault();const a=t.dataset.act,v=t.dataset.v;
  if(a==='be-go'){BE.view=v;beMsg(null);BE.f={};render();return}
  if(a==='be-login'||a==='be-register'||a==='be-reset'||a==='be-newpw'){
    BE.f={email:beV('be-email'),nome:beV('be-nome'),priv:!!(document.getElementById('be-priv')||{}).checked};const pw=(document.getElementById('be-pw')||{}).value||'';BE.f.pw='';
    try{
      if(a==='be-login'){const {error}=await BE.sb.auth.signInWithPassword({email:BE.f.email,password:pw});if(error)throw error}
      else if(a==='be-register'){
        if(!BE.f.nome||!BE.f.email){beMsg('Inserisci nome ed email.',1);render();return}if(pw.length<8){beMsg('La password deve avere almeno 8 caratteri.',1);render();return}
        if(!BE.f.priv){beMsg('Per registrarti serve il consenso al trattamento dei dati.',1);render();return}
        const {data,error}=await BE.sb.auth.signUp({email:BE.f.email,password:pw,options:{data:{nome:BE.f.nome,consenso:'true'},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
        if(!data.session){BE.view='login';beMsg('Registrazione quasi completata: ti abbiamo scritto per confermare l\'email. Dopo la conferma puoi accedere.');render();return}}
      else if(a==='be-reset'){const {error}=await BE.sb.auth.resetPasswordForEmail(BE.f.email,{redirectTo:location.origin+location.pathname});if(error)throw error;beMsg('Se l\'indirizzo è registrato, ti abbiamo inviato il link.');render();return}
      else{if(pw.length<8){beMsg('La password deve avere almeno 8 caratteri.',1);render();return}const {error}=await BE.sb.auth.updateUser({password:pw});if(error)throw error;BE.view='app';beMsg('Password aggiornata.');const {data}=await BE.sb.auth.getSession();if(data.session)await beLoad(data.session.user);return}
    }catch(err){beMsg(beErr(err),1);render()}
    return}
  if(a==='be-logout'){await BE.sb.auth.signOut();return}
  if(a==='be-tab'){BE.tab=v;BE.przForce=false;BE.przPend=null;BE.sel=null;BE.rep=null;beMsg(null);if(v==='portafogli')loadCat()}
  else if(a==='be-filtro')BE.filtro=v;
  else if(a==='be-cli'){BE.sel=v||null;beMsg(null)}
  else if(a==='be-stato'){const [cid,s]=v.split(':');await beCambiaStato(cid,s);return}
  else if(a==='be-del'){const {error}=await BE.sb.rpc('elimina_cliente',{p_id:v,p_conferma:beV('be-delc')});if(error){beMsg(/Conferma/.test(error.message||'')?'L\'email scritta non corrisponde: il cliente non è stato eliminato.':beErr(error),1)}else{BE.sel=null;beMsg('Cliente eliminato dal database.')}await beLoadAdmin();render();return}
  else if(a==='be-nota'){await beNota(v,beV('be-nota'));return}
  else if(a==='be-csv'){await beCsv(v||null);return}
  else if(a==='be-seed'){await beSeed();return}
  else if(a==='be-ocf'){BE.ocf=BE.ocf||trimPrec();const f=(document.getElementById('ocf-from')||{}).value,to=(document.getElementById('ocf-to')||{}).value;if(!f||!to||f>to){beMsg('Controlla le date: la data iniziale deve precedere quella finale.',1);render();return}BE.ocf.from=f;BE.ocf.to=to;beMsg(null);BE.ocf.res=ocfCalc(f,to)}
  else if(a==='be-ocfcsv'){if(BE.ocf&&BE.ocf.res)ocfCsv(BE.ocf.res);return}
  else if(a==='be-prz'){const vals={},righe=[];document.querySelectorAll('[data-prz]').forEach(i=>{if(i.value.trim()){vals[i.dataset.prz]=i.value.trim();const p=przNum(i.value);if(p)righe.push({isin:i.dataset.prz,prezzo:p})}});
    const bad=Object.keys(vals).filter(k=>!przNum(vals[k]));BE.przPend={date:beV('prz-d'),vals};
    if(bad.length){BE.przForce=false;beMsg('Controlla i numeri inseriti (usa cifre, con la virgola per i decimali).',1)}else{await bePrzSalva(righe)}}
  else if(a==='be-prz-dl'){przScarica();return}
  else if(a==='be-pesi'){pesiCsv();return}
  else if(a==='be-prz-csv'){const righe=[],sc=[];beV('prz-csv').split(/\n+/).forEach(r=>{const t=r.trim();if(!t)return;const m=t.split(/[;\t ]+/);const isin=(m[0]||'').toUpperCase(),p=przNum(m[1]||'');if(/^[A-Z0-9]{12}$/.test(isin)&&p)righe.push({isin,prezzo:p});else sc.push(t)});
    const ok=new Set(przStrumenti().map(x=>x.isin)),ign=righe.filter(r=>!ok.has(r.isin)).map(r=>r.isin);await bePrzSalva(righe,beV('prz-d'));if((sc.length||ign.length)&&BE.msg)BE.msg.t+=' Righe non lette: '+[...sc,...ign].slice(0,5).join(', ')+'.'}
  else if(a==='be-rep'){BE.rep=v||null}
  render();
});

const PF=()=>st.PF;
const impDate=x=>{if(x.data)return x.data;const d=new Date();d.setMonth(d.getMonth()+x.mesi);return d.toISOString().slice(0,10)};
const mmYYYY=iso=>{const d=new Date(iso);return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()};
const impOk=A=>A.imp===0||(A.imp===1&&(st.imp||[]).length>0&&st.imp.every(x=>x.amt>0&&x.mesi>0&&(x.uso===0||x.uso===1)));
const pnum=id=>+String(id||'').replace('P','');
const impAll=()=>st.A.imp===1?(st.imp||[]).filter(x=>x.uso!==0):[]; // solo le spese pagate con una parte del capitale sotto consulenza
const SLEEVE_DA=4; // i portafogli 1-3 sono abbastanza prudenti: le spese previste restano nel modello
const impAct=()=>(!st.chosen||pnum(st.chosen)>=SLEEVE_DA)?impAll():[];
const partsOf=x=>{if(!x.parti||!x.parti.length)x.parti=[{isin:x.isin,amt:x.amt}];return x.parti};
function impBlock(){
  const A=st.A;if(A.imp===0&&(st.imp||[]).length)st.imp=[];
  if(A.imp===1&&!(st.imp||[]).length)st.imp=[{motivo:IMP_MOTIVI[0],amt:0,mesi:36,data:impEnd(36)}];
  const L=st.imp||[];
  let h=`<div class="q"><div class="t">Hai spese importanti previste nei prossimi anni (casa, auto, viaggi, studi…) che pagherai con una parte del capitale che investirai?</div>${opt({id:'imp',o:['No','Sì']},A.imp,'ans')}</div>`;
  if(A.imp===1){
    h+=L.map((x,i)=>`<div class="imp"><label class="f">Motivo<select data-act="impmot" data-v="${i}">${IMP_MOTIVI.map(m=>`<option ${x.motivo===m?'selected':''}>${esc(m)}</option>`).join('')}</select></label><label class="f">Importo (€)<input type="number" min="0" step="1000" data-act="impamt" data-v="${i}" value="${x.amt||''}" placeholder="es. 20000"></label><label class="f">Mese e anno in cui ti servono i soldi<select data-act="impmesi" data-v="${i}">${IMP_MESI.map(([m,l])=>`<option value="${m}" ${x.mesi===m?'selected':''}>${l}</option>`).join('')}</select></label>${L.length>1?`<button class="btn sm" data-act="imprm" data-v="${i}">Togli</button>`:''}</div>${x.amt>0?`<div class="q"><div class="t">Userai parte del capitale che metterai sotto consulenza per far fronte a questa spesa?</div>${[['No, la pagherò con altre risorse',0],['Sì, userò parte del capitale investito',1]].map(([t,v])=>`<label class="opt"><input type="radio" name="uso${i}" data-act="impuso" data-v="${i}:${v}" ${x.uso===v?'checked':''}><span>${t}</span></label>`).join('')}${x.uso===1?`<div class="alert info"><b>Come lo useremo</b><span class="small">Se dal questionario risulterà adatto un portafoglio dal 4 al 10, i tuoi <b>${eur(x.amt)}</b> non verranno investiti nel portafoglio modello: li metteremo in un <b>BOT o BTP che scade a ridosso di ${esc((IMP_MESI.find(m=>m[0]===x.mesi)||[0,''])[1].toLowerCase())}</b>, così il capitale è disponibile quando serve. Il resto del capitale va nel portafoglio modello. Se invece risulterà adatto un portafoglio dal 1 al 3, molto prudente, tutto il capitale resta nel portafoglio modello.</span></div>`:x.uso===0?`<p class="small muted">Va bene: la spesa non incide sul capitale che metterai sotto consulenza, che andrà tutto nel portafoglio modello.</p>`:''}</div>`:''}`).join('');
    h+=(L.length<3?`<div class="row"><button class="btn sm" data-act="impadd">Aggiungi un'altra spesa</button></div>`:'')+`<p class="small muted">Scegli il mese e l'anno in cui ti servono i soldi: il sistema ti indica in automatico il BOT o il BTP che scade a ridosso di quella data. Se scegli un portafoglio dal 4 in poi, le somme che ti servono entro 3 anni non vanno nel portafoglio modello ma in quel titolo di Stato. Con i portafogli 1-3, molto prudenti, e per le spese oltre i 3 anni, tutto resta nel portafoglio modello.</p>`;
  }
  return h;
}

function impCands(x){
  const tgt=new Date(impDate(x)).getTime(),now=Date.now(),bot=x.mesi<=12,tipi=bot?['BOT']:['BTP','CTZ'];
  const src=(TITOLI||TS_MODELLI.map(t=>({...t,scadenza:t.scad}))).filter(t=>tipi.includes(t.tipo));
  const lo=new Date(tgt);lo.setMonth(lo.getMonth()-(bot?6:12));const minD=now+(bot?20:60)*864e5;
  const pick=a=>src.filter(t=>{const d=new Date(t.scadenza).getTime();return d<=tgt+864e5*3&&d>=a});
  let L=pick(Math.max(lo.getTime(),minD));if(!L.length)L=pick(minD);
  L=L.sort((p,q)=>new Date(q.scadenza)-new Date(p.scadenza)).slice(0,30).map(t=>({isin:t.isin,nome:t.nome,tipo:t.tipo,serie:t.serie,tasso:t.tasso,scad:t.scadenza}));
  if(bot&&BY.MON)L.push({etf:true,k:'MON',isin:BY.MON.isin,nome:BY.MON.name+' (ETF monetario, senza scadenza)'});
  return L}
